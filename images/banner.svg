<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="Awesome OpenArch">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="640" rx="32" fill="url(#bg)"/>

  <!-- Network: projects around a shared data layer -->
  <g transform="translate(1000 320)">
    <circle r="190" fill="url(#glow)"/>
    <g stroke="#7dd3fc" stroke-opacity="0.55" stroke-width="3">
      <line x1="0" y1="0" x2="-150" y2="-120"/>
      <line x1="0" y1="0" x2="0" y2="-180"/>
      <line x1="0" y1="0" x2="150" y2="-110"/>
      <line x1="0" y1="0" x2="175" y2="40"/>
      <line x1="0" y1="0" x2="95" y2="160"/>
      <line x1="0" y1="0" x2="-90" y2="165"/>
      <line x1="0" y1="0" x2="-180" y2="30"/>
    </g>
    <g stroke="#7dd3fc" stroke-opacity="0.25" stroke-width="2" fill="none">
      <polyline points="-150,-120 0,-180 150,-110 175,40 95,160 -90,165 -180,30 -150,-120"/>
    </g>
    <g fill="#0f172a" stroke-width="5">
      <circle cx="-150" cy="-120" r="20" stroke="#34d399"/>
      <circle cx="0" cy="-180" r="16" stroke="#fbbf24"/>
      <circle cx="150" cy="-110" r="22" stroke="#a78bfa"/>
      <circle cx="175" cy="40" r="16" stroke="#34d399"/>
      <circle cx="95" cy="160" r="20" stroke="#a78bfa"/>
      <circle cx="-90" cy="165" r="16" stroke="#fbbf24"/>
      <circle cx="-180" cy="30" r="20" stroke="#34d399"/>
    </g>
    <circle r="62" fill="#38bdf8"/>
    <circle r="62" fill="none" stroke="#e0f2fe" stroke-width="4" stroke-opacity="0.8"/>
    <g fill="#0f172a">
      <rect x="-28" y="-26" width="56" height="12" rx="6"/>
      <rect x="-28" y="-6" width="56" height="12" rx="6"/>
      <rect x="-28" y="14" width="56" height="12" rx="6"/>
    </g>
  </g>

  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="96" y="250" font-size="40" font-weight="600" fill="#7dd3fc" letter-spacing="6">AWESOME</text>
    <text x="90" y="350" font-size="112" font-weight="800" fill="#f8fafc">OpenArch</text>
    <text x="96" y="420" font-size="32" fill="#cbd5e1">Community projects, integrations and talks</text>
    <text x="96" y="462" font-size="32" fill="#cbd5e1">around one data layer for AI</text>
  </g>
</svg>
